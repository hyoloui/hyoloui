name: README 기간 갱신

on:
  schedule:
    - cron: "5 15 * * *" # 매일 00:05 KST
  push:
    branches: [main]
    paths: [".github/readme/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/readme/build.py
      - name: 바뀐 경우에만 커밋
        run: |
          git diff --quiet README.md && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898211+github-actions[bot]@users.noreply.github.com"
          git commit -am "docs: README 기간 갱신"
          git push
